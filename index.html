<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#101a3a" />
  <title>옹파이더: 뉴욕 웹스윙</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: #101a3a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none; user-select: none;
    }
    #game { display:block; width:100vw; height:100vh; }
    #hud {
      position: fixed; inset: 0; pointer-events:none; color:white;
      padding: max(14px, env(safe-area-inset-top)) 16px 16px;
      text-shadow: 0 2px 4px rgba(0,0,0,.45);
    }
    #top {
      display:flex; justify-content:space-between; align-items:flex-start;
      font-weight:800; font-size:18px;
    }
    #hint {
      position:absolute; left:50%; bottom:max(22px, env(safe-area-inset-bottom));
      transform:translateX(-50%);
      background:rgba(8,12,28,.72); border:1px solid rgba(255,255,255,.22);
      border-radius:999px; padding:10px 16px; font-weight:800; white-space:nowrap;
      transition:opacity .3s;
    }
    #overlay {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(rgba(9,16,41,.32), rgba(7,10,25,.75));
      padding:24px;
    }
    .card {
      width:min(440px, 92vw); text-align:center; color:#fff;
      background:rgba(12,18,42,.88); border:1px solid rgba(255,255,255,.18);
      box-shadow:0 20px 70px rgba(0,0,0,.45); border-radius:26px; padding:26px 22px;
      backdrop-filter: blur(10px);
    }
    h1 { margin:0 0 8px; font-size:30px; }
    .sub { opacity:.85; line-height:1.55; margin-bottom:20px; }
    button {
      pointer-events:auto; border:0; border-radius:18px; padding:15px 22px;
      width:100%; font-size:18px; font-weight:900; color:white;
      background:linear-gradient(135deg,#e9464f,#b51f3e);
      box-shadow:0 8px 24px rgba(220,37,65,.36);
    }
    .small { margin-top:14px; font-size:13px; opacity:.7; line-height:1.5; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="top">
      <div>점수 <span id="score">0</span></div>
      <div>최고 <span id="best">0</span></div>
    </div>
    <div id="hint">화면을 누르고 있으면 웹스윙!</div>
  </div>

  <div id="overlay">
    <div class="card">
      <h1>🐾 옹파이더</h1>
      <div class="sub">
        뉴욕의 밤하늘을 날아다니며<br>
        생선을 모으고 드론을 피하세요.
      </div>
      <button id="startBtn">게임 시작</button>
      <div class="small">
        조작: 화면 길게 누르기 = 상승 · 떼기 = 하강<br>
        앱 설치 없이 휴대폰 브라우저에서 바로 실행됩니다.
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('hint');

  let W=0,H=0,DPR=1;
  let running=false, holding=false, last=0, time=0, score=0;
  let speed=250, spawnTimer=0, fishTimer=0, shake=0;
  let best = Number(localStorage.getItem('ongpiderBest') || 0);
  bestEl.textContent = best;

  const player = { x:0, y:0, vy:0, r:28, rot:0 };
  let buildings=[], obstacles=[], fishes=[], particles=[], stars=[];

  function resize(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    initScene();
    player.x=W*.28; player.y=H*.45;
  }
  addEventListener('resize', resize);

  function rand(a,b){ return a+Math.random()*(b-a); }

  function initScene(){
    stars = Array.from({length:Math.floor(W*H/9000)},()=>({
      x:Math.random()*W, y:Math.random()*H*.62, s:rand(.5,2), a:rand(.25,.9)
    }));
    buildings=[];
    let x=-20;
    while(x<W+80){
      const w=rand(55,120), h=rand(H*.18,H*.48);
      buildings.push({x,w,h,shade:Math.floor(rand(18,42)), windows:Math.random()});
      x += w+rand(5,16);
    }
  }

  function reset(){
    running=true; holding=false; last=performance.now(); time=0; score=0;
    speed=250; spawnTimer=.8; fishTimer=1.2; shake=0;
    obstacles=[]; fishes=[]; particles=[];
    player.x=W*.28; player.y=H*.45; player.vy=0; player.rot=0;
    scoreEl.textContent='0';
    overlay.style.display='none';
    hint.style.opacity='1';
    setTimeout(()=> hint.style.opacity='0', 1800);
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', reset);

  function press(e){ e?.preventDefault(); holding=true; }
  function release(e){ e?.preventDefault(); holding=false; }
  addEventListener('pointerdown', e=>{ if(running) press(e); });
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);

  function spawnObstacle(){
    const gap = Math.max(150, H*.24);
    const cy = rand(H*.23, H*.70);
    obstacles.push({
      x:W+70, y:cy, r:rand(22,31),
      spin:rand(-2,2), angle:0, pulse:Math.random()*6
    });
  }

  function spawnFish(){
    fishes.push({x:W+40,y:rand(H*.18,H*.78),r:15,phase:Math.random()*6});
  }

  function burst(x,y,kind){
    for(let i=0;i<(kind==='hit'?22:10);i++){
      particles.push({
        x,y,vx:rand(-150,150),vy:rand(-170,70),
        life:rand(.35,.8),t:0,s:rand(2,6),kind
      });
    }
  }

  function update(dt){
    time += dt;
    speed = Math.min(430, 250 + time*5.5);
    score += dt*10;
    scoreEl.textContent=Math.floor(score);

    const lift = holding ? -1050 : 0;
    player.vy += (650 + lift)*dt;
    player.vy *= Math.pow(.985, dt*60);
    player.y += player.vy*dt;
    player.rot = Math.max(-.65, Math.min(.85, player.vy/700));

    spawnTimer -= dt;
    if(spawnTimer<=0){
      spawnObstacle();
      spawnTimer = rand(1.15,1.65) * (300/speed);
    }
    fishTimer -= dt;
    if(fishTimer<=0){
      spawnFish();
      fishTimer = rand(.85,1.45);
    }

    buildings.forEach(b=>b.x-=speed*.14*dt);
    for(const b of buildings){
      if(b.x+b.w<-30){
        b.x = Math.max(...buildings.map(v=>v.x+v.w))+rand(6,16);
        b.w=rand(55,120); b.h=rand(H*.18,H*.48);
      }
    }

    obstacles.forEach(o=>{
      o.x -= speed*dt; o.angle += o.spin*dt; o.pulse += dt*4;
      const dx=o.x-player.x, dy=o.y-player.y;
      if(dx*dx+dy*dy < (o.r+player.r*.74)**2) gameOver();
    });
    obstacles = obstacles.filter(o=>o.x>-80);

    fishes.forEach(f=>{
      f.x -= speed*dt; f.phase += dt*5;
      const fy=f.y+Math.sin(f.phase)*8;
      const dx=f.x-player.x, dy=fy-player.y;
      if(!f.got && dx*dx+dy*dy < (f.r+player.r*.78)**2){
        f.got=true; score+=75; burst(f.x,fy,'fish');
      }
    });
    fishes=fishes.filter(f=>f.x>-50 && !f.got);

    particles.forEach(p=>{
      p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=420*dt;
    });
    particles=particles.filter(p=>p.t<p.life);

    if(player.y<25 || player.y>H-28) gameOver();
  }

  function gameOver(){
    if(!running) return;
    running=false; shake=12; burst(player.x,player.y,'hit');
    best=Math.max(best,Math.floor(score));
    localStorage.setItem('ongpiderBest',best);
    bestEl.textContent=best;
    setTimeout(()=>{
      overlay.style.display='flex';
      overlay.querySelector('h1').textContent='앗! 옹기 추락';
      overlay.querySelector('.sub').innerHTML=`점수 <b>${Math.floor(score)}</b>점<br>뽕뽕이가 다시 출동 준비를 해줬어요.`;
      startBtn.textContent='다시 하기';
    },420);
  }

  function drawBackground(){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#172c61');
    g.addColorStop(.58,'#34245f');
    g.addColorStop(1,'#e05a56');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    ctx.globalAlpha=.85;
    for(const s of stars){
      ctx.fillStyle='white';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    const moonX=W*.79, moonY=H*.17, moonR=Math.min(W,H)*.075;
    ctx.fillStyle='#fff2c6'; ctx.beginPath(); ctx.arc(moonX,moonY,moonR,0,Math.PI*2);ctx.fill();

    for(const b of buildings){
      const y=H-b.h;
      ctx.fillStyle=`rgb(${b.shade},${b.shade+6},${b.shade+22})`;
      ctx.fillRect(b.x,y,b.w,b.h);
      const cols=Math.max(2,Math.floor(b.w/18));
      const rows=Math.floor(b.h/24);
      for(let iy=0;iy<rows;iy++){
        for(let ix=0;ix<cols;ix++){
          if(((ix*7+iy*11+Math.floor(b.x))%5)<2){
            ctx.fillStyle='rgba(255,222,133,.68)';
            ctx.fillRect(b.x+8+ix*17,y+10+iy*23,5,8);
          }
        }
      }
    }
    ctx.fillStyle='#0d1021'; ctx.fillRect(0,H-18,W,18);
  }

  function drawWeb(){
    if(!holding || !running) return;
    const ax=Math.min(W-20, player.x+W*.46);
    const ay=Math.max(18, player.y-H*.32);
    ctx.strokeStyle='rgba(255,255,255,.92)';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(player.x+15,player.y-10);
    const cx=(player.x+ax)/2, cy=(player.y+ay)/2-22;
    ctx.quadraticCurveTo(cx,cy,ax,ay);
    ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(ax,ay,4,0,Math.PI*2); ctx.fill();
  }

  function drawFish(f){
    const y=f.y+Math.sin(f.phase)*8;
    ctx.save(); ctx.translate(f.x,y);
    ctx.fillStyle='#ffd764';
    ctx.beginPath(); ctx.ellipse(0,0,15,10,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath(); ctx.moveTo(-13,0);ctx.lineTo(-23,-9);ctx.lineTo(-23,9);ctx.closePath();ctx.fill();
    ctx.fillStyle='#5a3a2a';ctx.beginPath();ctx.arc(7,-2,1.8,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  function drawDrone(o){
    ctx.save(); ctx.translate(o.x,o.y); ctx.rotate(o.angle);
    ctx.fillStyle='#252a39';
    ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#e9464f';
    ctx.beginPath();ctx.arc(0,0,6+Math.sin(o.pulse)*1.5,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#5d6474';ctx.lineWidth=5;
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*o.r*.6,Math.sin(a)*o.r*.6);
      ctx.lineTo(Math.cos(a)*(o.r+15),Math.sin(a)*(o.r+15));ctx.stroke();
    }
    ctx.restore();
  }

  function drawCat(){
    ctx.save();
    ctx.translate(player.x,player.y);
    ctx.rotate(player.rot);

    // tail
    ctx.strokeStyle='#77706f';ctx.lineWidth=11;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-24,15);ctx.quadraticCurveTo(-48,10,-42,-14);ctx.stroke();

    // body suit
    ctx.fillStyle='#152c5b';
    ctx.beginPath();ctx.ellipse(0,17,28,32,0,0,Math.PI*2);ctx.fill();

    // red torso
    ctx.fillStyle='#d83a43';
    ctx.beginPath();ctx.ellipse(0,4,27,22,0,Math.PI*2);ctx.fill();

    // web lines
    ctx.strokeStyle='rgba(40,15,25,.55)';ctx.lineWidth=1.2;
    for(let i=-18;i<=18;i+=9){
      ctx.beginPath();ctx.moveTo(i,-12);ctx.lineTo(i+4,20);ctx.stroke();
    }
    for(let j=-8;j<=14;j+=8){
      ctx.beginPath();ctx.moveTo(-22,j);ctx.quadraticCurveTo(0,j+5,22,j);ctx.stroke();
    }

    // legs and arms
    ctx.strokeStyle='#152c5b';ctx.lineWidth=13;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-13,33);ctx.lineTo(-25,49);ctx.stroke();
    ctx.beginPath();ctx.moveTo(13,33);ctx.lineTo(27,47);ctx.stroke();
    ctx.strokeStyle='#d83a43';
    ctx.beginPath();ctx.moveTo(-20,4);ctx.lineTo(-39,16);ctx.stroke();
    ctx.beginPath();ctx.moveTo(20,3);ctx.lineTo(39,-7);ctx.stroke();

    // head
    ctx.fillStyle='#8b8582';
    ctx.beginPath();ctx.arc(0,-23,31,0,Math.PI*2);ctx.fill();

    // ears
    ctx.fillStyle='#16171b';
    ctx.beginPath();ctx.moveTo(-23,-43);ctx.lineTo(-16,-66);ctx.lineTo(-4,-48);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(23,-43);ctx.lineTo(16,-66);ctx.lineTo(4,-48);ctx.closePath();ctx.fill();
    ctx.fillStyle='#6b5549';
    ctx.beginPath();ctx.moveTo(-18,-47);ctx.lineTo(-15,-58);ctx.lineTo(-9,-49);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(18,-47);ctx.lineTo(15,-58);ctx.lineTo(9,-49);ctx.closePath();ctx.fill();

    // face
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-10,-25,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(10,-25,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(-4,-12);ctx.lineTo(4,-12);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#161616';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(0,-7);ctx.stroke();
    for(const side of [-1,1]){
      for(let i=-1;i<=1;i++){
        ctx.beginPath();
        ctx.moveTo(side*10,-10+i*4);
        ctx.lineTo(side*27,-13+i*5);
        ctx.stroke();
      }
    }

    // chest emblem - original paw/web mark
    ctx.fillStyle='#11172a';
    ctx.beginPath();ctx.arc(0,2,5,0,Math.PI*2);ctx.fill();
    for(let i=0;i<4;i++){
      const a=-1.2+i*.8;
      ctx.beginPath();ctx.arc(Math.cos(a)*9,Math.sin(a)*7-3,2.4,0,Math.PI*2);ctx.fill();
    }

    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const a=1-p.t/p.life;
      ctx.globalAlpha=a;
      ctx.fillStyle=p.kind==='fish' ? '#ffd764' : '#ffffff';
      ctx.beginPath();ctx.arc(p.x,p.y,p.s*a,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function draw(){
    ctx.save();
    if(shake>0){ ctx.translate(rand(-shake,shake),rand(-shake,shake)); shake*=.86; }
    drawBackground();
    fishes.forEach(drawFish);
    obstacles.forEach(drawDrone);
    drawWeb();
    drawCat();
    drawParticles();
    ctx.restore();
  }

  function loop(now){
    if(!running){ draw(); return; }
    const dt=Math.min(.033,(now-last)/1000 || .016);
    last=now;
    update(dt);
    draw();
    if(running) requestAnimationFrame(loop);
    else requestAnimationFrame(()=>draw());
  }

  resize();
  draw();
})();
</script>
</body>
</html>
