<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13234f">
<title>옹파이더</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#13234f;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none
}
#game{
  position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(#18346e 0%,#32255f 62%,#a33f55 100%)
}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.75}
#moon{
  position:absolute;right:13%;top:17%;width:76px;height:76px;
  border-radius:50%;background:#fff1b7;box-shadow:0 0 20px rgba(255,241,183,.12)
}
#city{position:absolute;left:0;right:0;bottom:0;height:37%}
.building{position:absolute;bottom:0;background:#1b2639;border-top:2px solid rgba(255,255,255,.04)}
.window{position:absolute;width:6px;height:9px;background:#d5bd73;opacity:.85}
#ground{position:absolute;left:0;right:0;bottom:0;height:18px;background:#090f22}

#player{
  position:absolute;width:74px;height:91px;left:25%;top:43%;
  transform:translate(-50%,-50%);will-change:transform,left,top;z-index:4
}
.tail{
  position:absolute;width:41px;height:30px;left:-23px;top:44px;
  border-left:11px solid #85807c;border-bottom:11px solid #85807c;
  border-radius:0 0 0 28px;transform:rotate(12deg)
}
.body{
  position:absolute;width:52px;height:57px;left:12px;top:33px;
  border-radius:48% 48% 43% 43%;background:#183563
}
.suit{
  position:absolute;width:49px;height:39px;left:13px;top:35px;
  border-radius:50%;background:#d83e48
}
.leg{position:absolute;width:13px;height:34px;top:62px;background:#183563;border-radius:9px}
.leg.l{left:19px;transform:rotate(28deg)} .leg.r{right:15px;transform:rotate(-28deg)}
.arm{position:absolute;width:13px;height:39px;top:40px;background:#d83e48;border-radius:9px}
.arm.l{left:1px;transform:rotate(55deg)} .arm.r{right:-1px;transform:rotate(-58deg)}
.head{
  position:absolute;width:61px;height:57px;left:7px;top:0;
  border-radius:50%;background:#908b88;z-index:3
}
.ear{position:absolute;width:23px;height:29px;top:-12px;background:#15171c;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ear.l{left:2px;transform:rotate(-10deg)} .ear.r{right:2px;transform:rotate(10deg)}
.ear:after{content:"";position:absolute;left:7px;top:9px;width:10px;height:14px;background:#72584c;clip-path:inherit}
.eye{position:absolute;top:22px;width:6px;height:6px;background:#111;border-radius:50%}
.eye.l{left:17px}.eye.r{right:17px}
.nose{position:absolute;left:27px;top:32px;width:8px;height:6px;background:#111;clip-path:polygon(50% 100%,0 0,100% 0)}
.mouth{position:absolute;left:25px;top:40px;width:12px;height:2px;background:#111;border-radius:2px}
.whisker{position:absolute;width:21px;height:2px;background:#161616;top:37px}
.whisker.l1{left:-9px;transform:rotate(7deg)} .whisker.l2{left:-9px;top:43px;transform:rotate(-5deg)}
.whisker.r1{right:-9px;transform:rotate(-7deg)} .whisker.r2{right:-9px;top:43px;transform:rotate(5deg)}
.web{
  position:absolute;height:3px;background:#fff;transform-origin:left center;
  z-index:3;display:none;box-shadow:0 0 4px rgba(255,255,255,.7)
}
.drone{
  position:absolute;width:52px;height:52px;border-radius:50%;
  background:#282e3d;border:5px solid #697285;z-index:3;will-change:transform
}
.drone:before,.drone:after{
  content:"";position:absolute;left:-16px;right:-16px;top:20px;height:5px;background:#697285
}
.drone:after{transform:rotate(90deg)}
.drone i{
  position:absolute;width:13px;height:13px;left:50%;top:50%;
  transform:translate(-50%,-50%);border-radius:50%;background:#ef4d58;
  box-shadow:0 0 10px #ef4d58
}
.fish{
  position:absolute;width:31px;height:20px;border-radius:50%;background:#ffd769;z-index:3
}
.fish:before{
  content:"";position:absolute;left:-13px;top:2px;
  border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:15px solid #ffd769
}
.fish:after{
  content:"";position:absolute;right:6px;top:5px;width:4px;height:4px;border-radius:50%;background:#4d392b
}
.particle{
  position:absolute;width:7px;height:7px;border-radius:50%;background:#ffd769;z-index:6;pointer-events:none
}
#hud{
  position:fixed;z-index:10;left:0;right:0;top:0;
  padding:calc(env(safe-area-inset-top) + 15px) 18px 0;
  display:flex;justify-content:space-between;font-size:20px;font-weight:900;
  text-shadow:0 2px 5px rgba(0,0,0,.45);pointer-events:none
}
#hint{
  position:fixed;z-index:10;left:50%;bottom:calc(env(safe-area-inset-bottom) + 23px);
  transform:translateX(-50%);padding:11px 16px;border-radius:999px;
  background:rgba(7,11,29,.78);border:1px solid rgba(255,255,255,.2);
  font-weight:900;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none
}
#overlay{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);
  background:linear-gradient(rgba(6,10,27,.16),rgba(5,8,22,.76))
}
.card{
  width:min(420px,92vw);padding:27px 22px;text-align:center;border-radius:26px;
  background:rgba(13,19,45,.92);border:1px solid rgba(255,255,255,.17);
  box-shadow:0 25px 70px rgba(0,0,0,.45)
}
h1{font-size:31px;margin:0 0 8px}
#message{line-height:1.55;margin:0 0 20px;opacity:.88}
button{
  width:100%;border:0;border-radius:18px;padding:15px;color:#fff;
  background:linear-gradient(135deg,#ef4e58,#b61d3d);font-size:18px;font-weight:900;
  -webkit-appearance:none;appearance:none
}
.small{font-size:13px;opacity:.67;margin-top:13px}
</style>
</head>
<body>
<div id="game">
  <div id="moon"></div>
  <div id="city"></div>
  <div id="ground"></div>
  <div id="web" class="web"></div>
  <div id="player">
    <div class="tail"></div><div class="body"></div><div class="suit"></div>
    <div class="leg l"></div><div class="leg r"></div>
    <div class="arm l"></div><div class="arm r"></div>
    <div class="head">
      <div class="ear l"></div><div class="ear r"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="nose"></div><div class="mouth"></div>
      <div class="whisker l1"></div><div class="whisker l2"></div>
      <div class="whisker r1"></div><div class="whisker r2"></div>
    </div>
  </div>
</div>

<div id="hud"><div>점수 <span id="score">0</span></div><div>최고 <span id="best">0</span></div></div>
<div id="hint">화면 누르기 = 상승 · 떼기 = 하강</div>

<div id="overlay">
  <div class="card">
    <h1 id="title">🐾 옹파이더</h1>
    <p id="message">생선을 모으고 드론을 피하세요.</p>
    <button id="start" type="button">게임 시작</button>
    <div class="small">iPhone Safari 전용 안정화 버전</div>
  </div>
</div>

<script>
(function(){
"use strict";
var game=document.getElementById("game");
var city=document.getElementById("city");
var player=document.getElementById("player");
var web=document.getElementById("web");
var overlay=document.getElementById("overlay");
var start=document.getElementById("start");
var title=document.getElementById("title");
var message=document.getElementById("message");
var scoreEl=document.getElementById("score");
var bestEl=document.getElementById("best");
var hint=document.getElementById("hint");

var W=window.innerWidth,H=window.innerHeight;
var running=false,pressed=false,last=0,raf=0;
var y=H*.44,vy=0,score=0,time=0,speed=250;
var obstacleDelay=900,fishDelay=700,lastObstacle=0,lastFish=0;
var objects=[];
var best=parseInt(localStorage.getItem("ong_dom_best")||"0",10)||0;
bestEl.textContent=best;

function scene(){
  W=window.innerWidth; H=window.innerHeight;
  document.querySelectorAll(".star").forEach(function(n){n.remove()});
  for(var i=0;i<46;i++){
    var s=document.createElement("i");s.className="star";
    s.style.left=(Math.random()*100)+"%";s.style.top=(Math.random()*70)+"%";
    s.style.opacity=(.35+Math.random()*.6);s.style.transform="scale("+(0.6+Math.random()*1.2)+")";
    game.appendChild(s);
  }
  city.innerHTML="";
  var x=0,n=0;
  while(x<W+100){
    var b=document.createElement("div");b.className="building";
    var bw=55+Math.random()*70,bh=120+Math.random()*Math.max(120,H*.25);
    b.style.left=x+"px";b.style.width=bw+"px";b.style.height=bh+"px";
    for(var r=15;r<bh-15;r+=28){
      for(var c=12;c<bw-8;c+=22){
        if((r+c+n)%3===0){
          var win=document.createElement("i");win.className="window";
          win.style.left=c+"px";win.style.top=r+"px";b.appendChild(win);
        }
      }
    }
    city.appendChild(b);x+=bw+8+Math.random()*15;n++;
  }
  if(!running){y=H*.44;renderPlayer()}
}
function renderPlayer(){
  var angle=Math.max(-25,Math.min(35,vy/12));
  player.style.left=(W*.26)+"px";
  player.style.top=y+"px";
  player.style.transform="translate(-50%,-50%) rotate("+angle+"deg)";
  if(pressed&&running){
    var px=W*.26+18,py=y-8,tx=W*.75,ty=Math.max(30,y-H*.29);
    var dx=tx-px,dy=ty-py,len=Math.sqrt(dx*dx+dy*dy),ang=Math.atan2(dy,dx)*180/Math.PI;
    web.style.display="block";web.style.left=px+"px";web.style.top=py+"px";
    web.style.width=len+"px";web.style.transform="rotate("+ang+"deg)";
  }else web.style.display="none";
}
function addDrone(){
  var el=document.createElement("div");el.className="drone";el.innerHTML="<i></i>";
  var o={type:"drone",el:el,x:W+60,y:80+Math.random()*(H-190),w:52,h:52,spin:0};
  game.appendChild(el);objects.push(o)
}
function addFish(){
  var el=document.createElement("div");el.className="fish";
  var o={type:"fish",el:el,x:W+45,y:80+Math.random()*(H-180),w:31,h:20,t:Math.random()*6};
  game.appendChild(el);objects.push(o)
}
function particles(x,y){
  for(var i=0;i<8;i++){
    var p=document.createElement("i");p.className="particle";game.appendChild(p);
    var a=Math.random()*Math.PI*2,d=25+Math.random()*35;
    p.style.left=x+"px";p.style.top=y+"px";
    p.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px)",opacity:0}],{duration:450,fill:"forwards"});
    setTimeout(function(n){return function(){n.remove()}}(p),480)
  }
}
function reset(){
  objects.forEach(function(o){o.el.remove()});objects=[];
  running=true;pressed=false;y=H*.44;vy=0;score=0;time=0;speed=250;
  lastObstacle=0;lastFish=0;scoreEl.textContent="0";
  overlay.style.display="none";hint.style.opacity="1";
  setTimeout(function(){hint.style.opacity="0"},1600);
  cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)
}
function end(){
  if(!running)return;running=false;pressed=false;web.style.display="none";
  var final=Math.floor(score);
  if(final>best){best=final;localStorage.setItem("ong_dom_best",best);bestEl.textContent=best}
  title.textContent="앗! 옹기 추락";message.innerHTML="점수 <b>"+final+"</b>점<br>다시 출동 준비 완료!";
  start.textContent="다시 하기";
  setTimeout(function(){overlay.style.display="flex"},220)
}
function loop(now){
  if(!running)return;
  var dt=Math.min(.034,(now-last)/1000);last=now;time+=dt;
  speed=Math.min(390,250+time*5);score+=dt*10;scoreEl.textContent=Math.floor(score);
  vy+=(pressed?-520:590)*dt;vy=Math.max(-420,Math.min(520,vy));y+=vy*dt;
  if(now-lastObstacle>obstacleDelay*(250/speed)){addDrone();lastObstacle=now;obstacleDelay=1050+Math.random()*450}
  if(now-lastFish>fishDelay){addFish();lastFish=now;fishDelay=750+Math.random()*650}
  var px=W*.26,py=y;
  for(var i=objects.length-1;i>=0;i--){
    var o=objects[i];o.x-=speed*dt;if(o.type==="fish")o.t+=dt*5;
    var oy=o.y+(o.type==="fish"?Math.sin(o.t)*8:0);
    o.el.style.transform="translate3d("+o.x+"px,"+oy+"px,0)"+(o.type==="drone"?" rotate("+(time*80)+"deg)":"");
    var cx=o.x+o.w/2,cy=oy+o.h/2,dx=cx-px,dy=cy-py;
    var rr=o.type==="drone"?42:34;
    if(dx*dx+dy*dy<rr*rr){
      if(o.type==="fish"){score+=75;particles(cx,cy);o.el.remove();objects.splice(i,1)}
      else{end();return}
    }else if(o.x<-80){o.el.remove();objects.splice(i,1)}
  }
  renderPlayer();
  if(y<28||y>H-45){end();return}
  raf=requestAnimationFrame(loop)
}
function pressOn(e){if(e&&e.cancelable)e.preventDefault();if(running)pressed=true}
function pressOff(e){if(e&&e.cancelable)e.preventDefault();pressed=false}
start.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();reset()});
game.addEventListener("touchstart",pressOn,{passive:false});
game.addEventListener("touchend",pressOff,{passive:false});
game.addEventListener("touchcancel",pressOff,{passive:false});
game.addEventListener("pointerdown",pressOn);
window.addEventListener("pointerup",pressOff);
window.addEventListener("resize",scene);
scene();renderPlayer();
})();
</script>
</body>
</html>
