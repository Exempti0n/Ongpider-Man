<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101936">
<title>옹파이더</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101936;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    display: block;
  }
  #hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    padding:
      calc(env(safe-area-inset-top) + 16px)
      18px
      calc(env(safe-area-inset-bottom) + 16px);
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,.45);
    z-index: 3;
  }
  #hudTop {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: 900;
  }
  #tapHint {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%);
    background: rgba(8, 12, 30, .78);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px;
    padding: 11px 16px;
    font-weight: 900;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .25s ease;
  }
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      calc(env(safe-area-inset-top) + 20px)
      22px
      calc(env(safe-area-inset-bottom) + 20px);
    background: linear-gradient(rgba(8,12,34,.2), rgba(6,9,24,.72));
  }
  .card {
    width: min(430px, 92vw);
    padding: 26px 22px;
    border-radius: 26px;
    text-align: center;
    background: rgba(15, 21, 49, .9);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 24px 70px rgba(0,0,0,.42);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  h1 { margin: 0 0 8px; font-size: 31px; }
  #message {
    margin: 0 0 20px;
    opacity: .88;
    line-height: 1.55;
    font-size: 16px;
  }
  #start {
    width: 100%;
    border: 0;
    border-radius: 18px;
    padding: 15px 18px;
    color: white;
    background: linear-gradient(135deg, #ef4e58, #b81d3d);
    box-shadow: 0 10px 26px rgba(207,34,66,.35);
    font-size: 18px;
    font-weight: 900;
    appearance: none;
    -webkit-appearance: none;
  }
  #mini {
    margin-top: 13px;
    font-size: 13px;
    line-height: 1.45;
    opacity: .68;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="hudTop">
    <div>점수 <span id="score">0</span></div>
    <div>최고 <span id="best">0</span></div>
  </div>
  <div id="tapHint">화면을 누르면 상승 · 떼면 하강</div>
</div>

<div id="overlay">
  <div class="card">
    <h1 id="title">🐾 옹파이더</h1>
    <p id="message">도시를 날아다니며 생선을 먹고<br>드론을 피하세요.</p>
    <button id="start" type="button">게임 시작</button>
    <div id="mini">세로 화면 권장 · Safari 홈 화면 추가 가능</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d", { alpha: false });
  var scoreNode = document.getElementById("score");
  var bestNode = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var titleNode = document.getElementById("title");
  var messageNode = document.getElementById("message");
  var startButton = document.getElementById("start");
  var tapHint = document.getElementById("tapHint");

  var W = 390, H = 844, DPR = 1;
  var running = false;
  var pressing = false;
  var rafId = 0;
  var lastTime = 0;
  var elapsed = 0;
  var score = 0;
  var speed = 235;
  var obstacleTimer = 1.1;
  var fishTimer = .9;
  var best = parseInt(localStorage.getItem("ongpider_best") || "0", 10) || 0;

  var cat = { x: 110, y: 360, vy: 0, r: 25, rot: 0 };
  var obstacles = [];
  var fishes = [];
  var particles = [];
  var stars = [];
  var buildings = [];

  bestNode.textContent = String(best);

  function viewportHeight() {
    return window.visualViewport ? window.visualViewport.height : window.innerHeight;
  }

  function resize() {
    W = Math.max(320, window.innerWidth || 390);
    H = Math.max(500, viewportHeight() || window.innerHeight || 844);
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildScene();

    if (!running) {
      cat.x = W * .27;
      cat.y = H * .46;
      draw();
    }
  }

  function rnd(min, max) {
    return min + Math.random() * (max - min);
  }

  function buildScene() {
    stars = [];
    var count = Math.max(35, Math.floor(W * H / 8500));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * .66,
        s: rnd(.6, 1.9),
        a: rnd(.35, .95)
      });
    }

    buildings = [];
    var x = -10;
    while (x < W + 120) {
      var bw = rnd(54, 105);
      buildings.push({
        x: x,
        w: bw,
        h: rnd(H * .17, H * .40),
        shade: Math.floor(rnd(18, 39))
      });
      x += bw + rnd(7, 15);
    }
  }

  function resetGame() {
    running = true;
    pressing = false;
    elapsed = 0;
    score = 0;
    speed = 235;
    obstacleTimer = .9;
    fishTimer = 1.0;
    obstacles = [];
    fishes = [];
    particles = [];
    cat.x = W * .27;
    cat.y = H * .46;
    cat.vy = 0;
    cat.rot = 0;
    scoreNode.textContent = "0";
    overlay.style.display = "none";
    tapHint.style.opacity = "1";
    window.setTimeout(function () {
      tapHint.style.opacity = "0";
    }, 1600);

    cancelAnimationFrame(rafId);
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function endGame() {
    if (!running) return;
    running = false;
    pressing = false;

    burst(cat.x, cat.y, 20, true);

    var finalScore = Math.floor(score);
    if (finalScore > best) {
      best = finalScore;
      localStorage.setItem("ongpider_best", String(best));
      bestNode.textContent = String(best);
    }

    draw();

    window.setTimeout(function () {
      titleNode.textContent = "앗! 옹기 추락";
      messageNode.innerHTML = "점수 <b>" + finalScore + "</b>점<br>다시 출동 준비 완료!";
      startButton.textContent = "다시 하기";
      overlay.style.display = "flex";
    }, 250);
  }

  function spawnObstacle() {
    obstacles.push({
      x: W + 45,
      y: rnd(H * .20, H * .76),
      r: rnd(21, 29),
      angle: rnd(0, Math.PI * 2),
      spin: rnd(-2.2, 2.2),
      pulse: rnd(0, Math.PI * 2)
    });
  }

  function spawnFish() {
    fishes.push({
      x: W + 40,
      y: rnd(H * .18, H * .78),
      phase: rnd(0, Math.PI * 2),
      got: false
    });
  }

  function burst(x, y, count, hit) {
    for (var i = 0; i < count; i++) {
      particles.push({
        x: x,
        y: y,
        vx: rnd(-135, 135),
        vy: rnd(-165, 55),
        t: 0,
        life: rnd(.3, .75),
        size: rnd(2, 5),
        hit: hit
      });
    }
  }

  function update(dt) {
    elapsed += dt;
    speed = Math.min(390, 235 + elapsed * 5);
    score += dt * 10;
    scoreNode.textContent = String(Math.floor(score));

    var accel = pressing ? -480 : 560;
    cat.vy += accel * dt;
    if (pressing && cat.vy > 100) cat.vy -= 300 * dt;
    cat.vy = Math.max(-430, Math.min(520, cat.vy));
    cat.y += cat.vy * dt;
    cat.rot = Math.max(-.5, Math.min(.75, cat.vy / 650));

    obstacleTimer -= dt;
    if (obstacleTimer <= 0) {
      spawnObstacle();
      obstacleTimer = rnd(1.15, 1.65) * (250 / speed);
    }

    fishTimer -= dt;
    if (fishTimer <= 0) {
      spawnFish();
      fishTimer = rnd(.85, 1.45);
    }

    for (var b = 0; b < buildings.length; b++) {
      buildings[b].x -= speed * .13 * dt;
    }
    for (var k = 0; k < buildings.length; k++) {
      var building = buildings[k];
      if (building.x + building.w < -20) {
        var maxX = 0;
        for (var m = 0; m < buildings.length; m++) {
          maxX = Math.max(maxX, buildings[m].x + buildings[m].w);
        }
        building.x = maxX + rnd(8, 16);
        building.w = rnd(54, 105);
        building.h = rnd(H * .17, H * .40);
      }
    }

    for (var i = obstacles.length - 1; i >= 0; i--) {
      var o = obstacles[i];
      o.x -= speed * dt;
      o.angle += o.spin * dt;
      o.pulse += dt * 4;

      var dx = o.x - cat.x;
      var dy = o.y - cat.y;
      var rr = o.r + cat.r * .72;
      if (dx * dx + dy * dy < rr * rr) {
        endGame();
        return;
      }
      if (o.x < -70) obstacles.splice(i, 1);
    }

    for (var f = fishes.length - 1; f >= 0; f--) {
      var fish = fishes[f];
      fish.x -= speed * dt;
      fish.phase += dt * 5;
      var fy = fish.y + Math.sin(fish.phase) * 7;
      var fdx = fish.x - cat.x;
      var fdy = fy - cat.y;

      if (!fish.got && fdx * fdx + fdy * fdy < 34 * 34) {
        fish.got = true;
        score += 75;
        burst(fish.x, fy, 10, false);
      }
      if (fish.x < -45 || fish.got) fishes.splice(f, 1);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var part = particles[p];
      part.t += dt;
      part.x += part.vx * dt;
      part.y += part.vy * dt;
      part.vy += 400 * dt;
      if (part.t >= part.life) particles.splice(p, 1);
    }

    if (cat.y < 20 || cat.y > H - 34) endGame();
  }

  function drawBackground() {
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#1d346c");
    grad.addColorStop(.58, "#31275f");
    grad.addColorStop(1, "#a83f55");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.a;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var moonR = Math.min(W, H) * .07;
    ctx.fillStyle = "#fff2bd";
    ctx.beginPath();
    ctx.arc(W * .79, H * .18, moonR, 0, Math.PI * 2);
    ctx.fill();

    for (var b = 0; b < buildings.length; b++) {
      var build = buildings[b];
      var by = H - build.h;
      ctx.fillStyle = "rgb(" + build.shade + "," + (build.shade + 7) + "," + (build.shade + 25) + ")";
      ctx.fillRect(build.x, by, build.w, build.h);

      var cols = Math.max(2, Math.floor(build.w / 20));
      var rows = Math.floor(build.h / 26);
      for (var iy = 0; iy < rows; iy++) {
        for (var ix = 0; ix < cols; ix++) {
          if (((ix * 5 + iy * 7 + Math.floor(build.x)) % 4) === 0) {
            ctx.fillStyle = "rgba(255,222,132,.72)";
            ctx.fillRect(build.x + 9 + ix * 18, by + 12 + iy * 24, 6, 9);
          }
        }
      }
    }

    ctx.fillStyle = "#0b1023";
    ctx.fillRect(0, H - 18, W, 18);
  }

  function drawWeb() {
    if (!pressing || !running) return;
    var ax = Math.min(W - 15, cat.x + W * .48);
    var ay = Math.max(24, cat.y - H * .30);
    ctx.strokeStyle = "rgba(255,255,255,.95)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cat.x + 14, cat.y - 7);
    ctx.quadraticCurveTo((cat.x + ax) / 2, (cat.y + ay) / 2 - 24, ax, ay);
    ctx.stroke();
  }

  function drawFish(fish) {
    var y = fish.y + Math.sin(fish.phase) * 7;
    ctx.save();
    ctx.translate(fish.x, y);
    ctx.fillStyle = "#ffd96a";
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-12, 0);
    ctx.lineTo(-22, -8);
    ctx.lineTo(-22, 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#4d392b";
    ctx.beginPath();
    ctx.arc(7, -2, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawDrone(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.angle);

    ctx.strokeStyle = "#677084";
    ctx.lineWidth = 5;
    for (var i = 0; i < 4; i++) {
      var a = i * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * o.r * .55, Math.sin(a) * o.r * .55);
      ctx.lineTo(Math.cos(a) * (o.r + 14), Math.sin(a) * (o.r + 14));
      ctx.stroke();
    }

    ctx.fillStyle = "#262b3a";
    ctx.beginPath();
    ctx.arc(0, 0, o.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ef4d57";
    ctx.beginPath();
    ctx.arc(0, 0, 6 + Math.sin(o.pulse) * 1.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawCat() {
    ctx.save();
    ctx.translate(cat.x, cat.y);
    ctx.rotate(cat.rot);

    ctx.strokeStyle = "#7f7a77";
    ctx.lineWidth = 10;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-22, 13);
    ctx.quadraticCurveTo(-44, 10, -39, -13);
    ctx.stroke();

    ctx.fillStyle = "#17315f";
    ctx.beginPath();
    ctx.ellipse(0, 17, 27, 31, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#da3e47";
    ctx.beginPath();
    ctx.ellipse(0, 5, 26, 21, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#17315f";
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(-13, 34);
    ctx.lineTo(-25, 49);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(13, 34);
    ctx.lineTo(26, 47);
    ctx.stroke();

    ctx.strokeStyle = "#da3e47";
    ctx.beginPath();
    ctx.moveTo(-19, 4);
    ctx.lineTo(-37, 15);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(19, 4);
    ctx.lineTo(38, -6);
    ctx.stroke();

    ctx.fillStyle = "#8f8a87";
    ctx.beginPath();
    ctx.arc(0, -24, 30, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#17181c";
    ctx.beginPath();
    ctx.moveTo(-23, -43);
    ctx.lineTo(-16, -65);
    ctx.lineTo(-4, -48);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(23, -43);
    ctx.lineTo(16, -65);
    ctx.lineTo(4, -48);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#695449";
    ctx.beginPath();
    ctx.moveTo(-18, -47);
    ctx.lineTo(-15, -58);
    ctx.lineTo(-9, -49);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(18, -47);
    ctx.lineTo(15, -58);
    ctx.lineTo(9, -49);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#111";
    ctx.beginPath();
    ctx.arc(-10, -26, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(10, -26, 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(-4, -13);
    ctx.lineTo(4, -13);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#111";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -9);
    ctx.lineTo(8, -9);
    ctx.stroke();

    for (var side = -1; side <= 1; side += 2) {
      for (var w = -1; w <= 1; w++) {
        ctx.beginPath();
        ctx.moveTo(side * 10, -10 + w * 4);
        ctx.lineTo(side * 27, -13 + w * 5);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var alpha = 1 - p.t / p.life;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.hit ? "#ffffff" : "#ffd96a";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    drawBackground();

    for (var i = 0; i < fishes.length; i++) drawFish(fishes[i]);
    for (var j = 0; j < obstacles.length; j++) drawDrone(obstacles[j]);

    drawWeb();
    drawCat();
    drawParticles();
  }

  function loop(now) {
    if (!running) return;

    var dt = Math.min(.032, Math.max(.001, (now - lastTime) / 1000));
    lastTime = now;

    update(dt);
    draw();

    if (running) rafId = requestAnimationFrame(loop);
  }

  function setPress(value, event) {
    if (event && event.cancelable) event.preventDefault();
    if (!running) return;
    pressing = value;
  }

  startButton.addEventListener("click", function (e) {
    e.preventDefault();
    resetGame();
  }, false);

  document.addEventListener("touchstart", function (e) {
    if (running) setPress(true, e);
  }, { passive: false });

  document.addEventListener("touchend", function (e) {
    setPress(false, e);
  }, { passive: false });

  document.addEventListener("touchcancel", function (e) {
    setPress(false, e);
  }, { passive: false });

  document.addEventListener("mousedown", function (e) {
    if (running) setPress(true, e);
  }, false);

  document.addEventListener("mouseup", function (e) {
    setPress(false, e);
  }, false);

  window.addEventListener("resize", resize, false);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", resize, false);
  }

  resize();
  draw();
})();
</script>
</body>
</html>
